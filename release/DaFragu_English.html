ent.`,`Capisco, ma mi serve un momento.`],[`We’re here on holiday.`,`Siamo qui in vacanza.`]],dialogue:[[`Host`,`Hello! Where are you from?`],[`You`,`We’re from Italy. We’re here on holiday.`],[`Host`,`Lovely! Is this your first visit?`],[`You`,`Sorry, could you say that again, please?`]],listen:{prompt:`Che cosa chiede l’host dopo la presentazione?`,options:[`Se avete già visitato il posto`,`Quanto dura la vacanza`,`Dove dormite`],answer:0,why:`“Is this your first visit?” significa “È la vostra prima visita?”.`},choice:{prompt:`Non hai capito. Quale richiesta è naturale e cortese?`,options:[`Repeat you please.`,`Could you say that again, please?`,`You say again yesterday.`],answer:1,why:`“Could you say that again?” è una richiesta cortese. Il verbo dopo “could” resta nella forma base.`},order:`Could you speak more slowly please`,orderIt:`Potrebbe parlare più lentamente, per favore?`,gap:`We’re ___ Italy.`,gapAnswer:`from`,speak:`L’host ti chiede da dove venite e perché siete qui. Rispondi in due frasi.`,speakModel:`We’re from Italy. We’re here on holiday.`},{id:`airport`,title:`Pronti al decollo`,en:`At the airport`,category:`In viaggio`,icon:`plane`,color:`blue`,goal:`Gestire bagagli, gate e imbarco.`,rule:`“Where is…?” per una cosa singola, “Where are…?” per il plurale. “Can I take…?” per chiedere se puoi portare qualcosa. Attenzione a “gate”: è l’uscita d’imbarco.`,phrases:[[`Where is the check-in desk?`,`Dov’è il banco del check-in?`],[`Can I take this bag on board?`,`Posso portare questa borsa a bordo?`],[`Which gate does our flight leave from?`,`Da quale gate parte il nostro volo?`],[`Is the flight on time?`,`Il volo è in orario?`],[`We have a connecting flight.`,`Abbiamo un volo in coincidenza.`]],dialogue:[[`You`,`Hello. Is the flight to Hong Kong on time?`],[`Agent`,`Yes. Boarding starts at six fifteen at gate twelve.`],[`You`,`Can I take this bag on board?`],[`Agent`,`Yes, you can. Please have your passport ready.`]],listen:{prompt:`A che ora inizia l’imbarco?`,options:[`Alle 6:50`,`Alle 12:15`,`Alle 6:15`],answer:2,why:`“Six fifteen” è 6:15. “Six fifty” sarebbe 6:50. Il gate è il numero 12.`},choice:{prompt:`Vuoi sapere se il volo è puntuale.`,options:[`Is the flight on time?`,`Is the flight in time yesterday?`,`The flight has time?`],answer:0,why:`“On time” significa “in orario”. È un’espressione utile da ricordare intera.`},order:`Can I take this bag on board`,orderIt:`Posso portare questa borsa a bordo?`,gap:`Where ___ the check-in desk?`,gapAnswer:`is`,speak:`Chiedi se il volo è in orario e da quale gate parte.`,speakModel:`Is the flight on time? Which gate does our flight leave from?`},{id:`hotel`,title:`Una camera per due`,en:`Checking in`,category:`In viaggio`,icon:`bed`,color:`peach`,goal:`Fare il check-in e chiedere le informazioni essenziali.`,rule:`“I have a reservation” = ho una prenotazione. “Under the name…” introduce il cognome della prenotazione. “Is … included?” serve per chiedere cosa è compreso.`,phrases:[[`We have a reservation under the name Del Cielo.`,`Abbiamo una prenotazione a nome Del Cielo.`],[`Is breakfast included?`,`La colazione è inclusa?`],[`What time is check-out?`,`A che ora è il check-out?`],[`Could we leave our luggage here?`,`Potremmo lasciare qui i bagagli?`],[`Could we have a quiet room?`,`Potremmo avere una camera tranquilla?`]],dialogue:[[`You`,`We have a reservation under the name Del Cielo.`],[`Receptionist`,`Welcome! You’re staying for three nights. Breakfast is from seven to ten.`],[`You`,`Is breakfast included?`],[`Receptionist`,`Yes. Check-out is at eleven.`]],listen:{prompt:`A che ora dovete lasciare la camera?`,options:[`Alle 10`,`Alle 11`,`Alle 7`],answer:1,why:`Il check-out è “at eleven”. Dalle 7 alle 10 è invece l’orario della colazione.`},choice:{prompt:`Quale frase useresti per lasciare i bagagli in hotel?`,options:[`Could we leave our luggage here?`,`Could we lose our luggage here?`,`We luggage leave yesterday?`],answer:0,why:`“Leave” significa lasciare; “lose” significa perdere. “Luggage” è un nome non numerabile: niente -s.`},order:`Is breakfast included in the price`,orderIt:`La colazione è inclusa nel prezzo?`,gap:`We have a reservation ___ the name Del Cielo.`,gapAnswer:`under`,speak:`Presentati alla reception, comunica il nome della prenotazione e chiedi se la colazione è inclusa.`,speakModel:`We have a reservation under the name Del Cielo. Is breakfast included?`},{id:`food`,title:`Un tavolo, due appetiti`,en:`Let’s order`,category:`Vita quotidiana`,icon:`utensils`,color:`peach`,goal:`Ordinare e chiedere il conto in modo naturale.`,rule:`“I’d like…” (I would like) è più cortese di “I want”. Per ordinare: “Could I have…?” In inglese britannico il conto è “the bill”; in americano anche “the check”.`,phrases:[[`A table for two, please.`,`Un tavolo per due, per favore.`],[`I’d like the grilled fish, please.`,`Vorrei il pesce alla griglia, per favore.`],[`Does this dish contain nuts?`,`Questo piatto contiene frutta a guscio?`],[`Could we have some still water?`,`Potremmo avere dell’acqua naturale?`],[`Could we have the bill, please?`,`Potremmo avere il conto, per favore?`]],dialogue:[[`Waiter`,`Are you ready to order?`],[`You`,`Yes. I’d like the grilled fish, please.`],[`Waiter`,`Would you like rice or salad with that?`],[`You`,`Salad, please. And some still water.`]],listen:{prompt:`Quale contorno viene scelto?`,options:[`Riso`,`Patatine`,`Insalata`],answer:2,why:`La risposta è “Salad, please”. “Rice or salad” sono le due opzioni proposte dal cameriere.`},choice:{prompt:`Vuoi ordinare con cortesia.`,options:[`I want fish now.`,`I’d like the grilled fish, please.`,`I like fish yesterday.`],answer:1,why:`“I’d like” esprime ciò che vorresti adesso; “I like” descrive un gusto generale.`},order:`Could we have the bill please`,orderIt:`Potremmo avere il conto, per favore?`,gap:`A table ___ two, please.`,gapAnswer:`for`,speak:`Chiedi un tavolo per due e ordina dell’acqua naturale.`,speakModel:`A table for two, please. Could we have some still water?`},{id:`directions`,title:`Da qui a lì`,en:`Finding your way`,category:`In viaggio`,icon:`map`,color:`mint`,goal:`Chiedere indicazioni e capire una risposta breve.`,rule:`“How do we get to…?” = come arriviamo a…? Nelle indicazioni trovi spesso l’imperativo: “Go straight”, “Turn left”, “Turn right”. “On your left” indica il lato sinistro.`,phrases:[[`How do we get to the station?`,`Come arriviamo alla stazione?`],[`Is it within walking distance?`,`Si può raggiungere a piedi?`],[`Go straight and turn left.`,`Vada dritto e giri a sinistra.`],[`It’s on your right.`,`È sulla destra.`],[`How long does it take to walk there?`,`Quanto ci vuole per arrivarci a piedi?`]],dialogue:[[`You`,`Excuse me. How do we get to the station?`],[`Local`,`Go straight, then turn right at the traffic lights.`],[`You`,`Is it far?`],[`Local`,`No, about ten minutes on foot.`]],listen:{prompt:`Dove dovete girare e in che direzione?`,options:[`A destra al semaforo`,`A sinistra alla stazione`,`A destra dopo dieci semafori`],answer:0,why:`“Turn right at the traffic lights” = girate a destra al semaforo. “Ten minutes” è il tempo a piedi.`},choice:{prompt:`Come chiedi se potete arrivarci a piedi?`,options:[`Is it foot distance?`,`Is it within walking distance?`,`Can distance walking?`],answer:1,why:`“Within walking distance” è l’espressione naturale per un luogo raggiungibile a piedi.`},order:`How do we get to the station`,orderIt:`Come arriviamo alla stazione?`,gap:`Turn ___ at the traffic lights. (a destra)`,gapAnswer:`right`,speak:`Chiedi come arrivare alla stazione e quanto ci vuole a piedi.`,speakModel:`How do we get to the station? How long does it take to walk there?`},{id:`transport`,title:`Il biglietto giusto`,en:`Getting around`,category:`In viaggio`,icon:`train`,color:`blue`,goal:`Comprare biglietti e verificare la direzione.`,rule:`Per acquistare: “Two tickets to…, please.” Per una corsa singola: “one-way” (USA) o “single” (UK); andata e ritorno: “round-trip” (USA) o “return” (UK).`,phrases:[[`Two tickets to the city centre, please.`,`Due biglietti per il centro, per favore.`],[`Does this bus go to the airport?`,`Questo autobus va all’aeroporto?`],[`Where do we need to change?`,`Dove dobbiamo cambiare?`],[`Which platform does the train leave from?`,`Da quale binario parte il treno?`],[`Where should we get off?`,`Dove dovremmo scendere?`]],dialogue:[[`You`,`Does this bus go to the airport?`],[`Driver`,`No. Take bus twenty-four from the stop across the street.`],[`You`,`How long does it take?`],[`Driver`,`About forty minutes.`]],listen:{prompt:`Quale autobus dovete prendere?`,options:[`Il 40 da questa fermata`,`Il 24 dall’altro lato della strada`,`Il 24 dal binario 4`],answer:1,why:`“Bus twenty-four” è il 24. “Across the street” indica l’altro lato della strada.`},choice:{prompt:`Chiedi dove scendere.`,options:[`Where should we get off?`,`Where should we get up?`,`Where are we get out yesterday?`],answer:0,why:`Per scendere da bus o treno si usa “get off”. “Get up” significa alzarsi.`},order:`Does this bus go to the airport`,orderIt:`Questo autobus va all’aeroporto?`,gap:`Two tickets ___ the city centre, please.`,gapAnswer:`to`,speak:`Chiedi se l’autobus va all’aeroporto e dove dovete scendere.`,speakModel:`Does this bus go to the airport? Where should we get off?`},{id:`shopping`,title:`Quanto costa?`,en:`Shopping & payments`,category:`Vita quotidiana`,icon:`bag`,color:`lilac`,goal:`Chiedere prezzi, taglie e pagare.`,rule:`“How much is this?” per un oggetto; “How much are these?” per più oggetti. “Can I try it on?” si usa per provare un capo. “By card” = con carta.`,phrases:[[`How much is this?`,`Quanto costa questo?`],[`Do you have this in a larger size?`,`Avete questo in una taglia più grande?`],[`Can I try it on?`,`Posso provarlo?`],[`Can I pay by card?`,`Posso pagare con carta?`],[`Could I have a receipt, please?`,`Potrei avere lo scontrino, per favore?`]],dialogue:[[`You`,`How much is this jacket?`],[`Shop assistant`,`It’s eighty pounds.`],[`You`,`Do you have it in a larger size?`],[`Shop assistant`,`Yes. You can try it on over there.`]],listen:{prompt:`Quanto costa la giacca?`,options:[`18 sterline`,`80 euro`,`80 sterline`],answer:2,why:`“Eighty pounds” significa 80 sterline. “Eighteen” sarebbe 18.`},choice:{prompt:`Vorresti provare la giacca.`,options:[`Can I try it on?`,`Can I try it up?`,`Can I prove it?`],answer:0,why:`“Try on” significa provare un indumento. “Prove” significa dimostrare.`},order:`Can I pay by card please`,orderIt:`Posso pagare con carta, per favore?`,gap:`How much ___ these shoes?`,gapAnswer:`are`,speak:`Chiedi il prezzo, una taglia più grande e se puoi pagare con carta.`,speakModel:`How much is this? Do you have this in a larger size? Can I pay by card?`},{id:`plans`,title:`Cosa facciamo domani?`,en:`Making plans`,category:`Conversazione`,icon:`sun`,color:`peach`,goal:`Parlare dei vostri programmi e prenotare un’attività.`,rule:`“We’re going to + verbo” esprime un’intenzione. “We’d like to + verbo” una cosa che vorreste fare. Per una proposta semplice: “Shall we…?”`,phrases:[[`We’re going to visit the museum tomorrow.`,`Domani visiteremo il museo.`],[`We’d like to book a tour for two.`,`Vorremmo prenotare un tour per due.`],[`What time does it start?`,`A che ora inizia?`],[`How long does the tour last?`,`Quanto dura il tour?`],[`Shall we go there tomorrow?`,`Ci andiamo domani?`]],dialogue:[[`You`,`We’d like to book a tour for two.`],[`Guide`,`Of course. We have a walking tour tomorrow at nine thirty.`],[`You`,`How long does it last?`],[`Guide`,`Two hours. Please arrive fifteen minutes early.`]],listen:{prompt:`Quando inizia il tour e quanto dura?`,options:[`Alle 9:15, dura 30 minuti`,`Alle 9:30, dura due ore`,`Alle 9, dura 15 minuti`],answer:1,why:`Inizia alle “nine thirty” (9:30), dura “two hours”. Bisogna arrivare 15 minuti prima.`},choice:{prompt:`Qual è una frase corretta per un programma?`,options:[`We going visit tomorrow.`,`We’re going to visit the museum tomorrow.`,`We went tomorrow museum.`],answer:1,why:`La struttura è soggetto + am/is/are + going to + verbo base.`},order:`We would like to book a tour`,orderIt:`Vorremmo prenotare un tour.`,gap:`What time ___ the tour start?`,gapAnswer:`does`,speak:`Prenota un tour per due e chiedi a che ora comincia e quanto dura.`,speakModel:`We’d like to book a tour for two. What time does it start? How long does it last?`},{id:`smalltalk`,title:`Due chiacchiere`,en:`A little conversation`,category:`Conversazione`,icon:`chat`,color:`lilac`,goal:`Sostenere uno scambio breve senza cercare frasi perfette.`,rule:`Una risposta + un dettaglio + una domanda tengono viva la conversazione. “Have you been to…?” chiede un’esperienza di vita; “We went… last year” racconta un momento passato preciso.`,phrases:[[`Have you ever been to Italy?`,`Sei mai stato in Italia?`],[`We live in Genoa, near the sea.`,`Viviamo a Genova, vicino al mare.`],[`We love travelling together.`,`Ci piace molto viaggiare insieme.`],[`What do you recommend around here?`,`Cosa consigli qui in zona?`],[`It was lovely talking to you.`,`È stato un piacere parlare con te.`]],dialogue:[[`Traveller`,`Have you been here before?`],[`You`,`Yes, we visited a few years ago. We love this city.`],[`Traveller`,`What do you like about it?`],[`You`,`The food and the views. What do you recommend around here?`]],listen:{prompt:`È la vostra prima visita?`,options:[`Sì, siete appena arrivati per la prima volta`,`Non viene detto`,`No, ci siete stati qualche anno fa`],answer:2,why:`“We visited a few years ago” significa “ci siamo stati qualche anno fa”.`},choice:{prompt:`Vuoi sapere se qualcuno ha mai visitato l’Italia.`,options:[`Have you ever been to Italy?`,`Did you ever been in Italy tomorrow?`,`Are you ever go Italy?`],answer:0,why:`Per chiedere un’esperienza: “Have you ever been to…?”. Per un luogo visitato si usa “to”.`},order:`We love travelling together`,orderIt:`Ci piace molto viaggiare insieme.`,gap:`We live ___ Genoa.`,gapAnswer:`in`,speak:`Di’ dove vivete, cosa vi piace fare e chiedi un consiglio sulla zona.`,speakModel:`We live in Genoa, near the sea. We love travelling together. What do you recommend around here?`},{id:`problem`,title:`C’è un piccolo problema`,en:`When things go wrong`,category:`Imprevisti`,icon:`help`,color:`peach`,goal:`Spiegare un problema e chiedere una soluzione.`,rule:`Per un problema attuale: “The … isn’t working.” Per chiedere aiuto: “Could you help us?” Per raccontare cosa manca: “We haven’t received…” (non abbiamo ricevuto).`,phrases:[[`The air conditioning isn’t working.`,`L’aria condizionata non funziona.`],[`There’s a problem with our room.`,`C’è un problema con la nostra camera.`],[`We haven’t received our tickets.`,`Non abbiamo ricevuto i nostri biglietti.`],[`Could you help us, please?`,`Potrebbe aiutarci, per favore?`],[`Could we change rooms?`,`Potremmo cambiare camera?`]],dialogue:[[`You`,`There’s a problem with our room. The air conditioning isn’t working.`],[`Receptionist`,`I’m sorry. We’ll send someone up in twenty minutes.`],[`You`,`Thank you. Could we change rooms if it can’t be fixed?`],[`Receptionist`,`Yes, of course.`]],listen:{prompt:`Cosa propone la reception come primo intervento?`,options:[`Inviare qualcuno tra venti minuti`,`Cambiare subito hotel`,`Restituire i soldi`],answer:0,why:`“We’ll send someone up in twenty minutes” significa che manderanno qualcuno in camera tra venti minuti.`},choice:{prompt:`Vuoi dire che il climatizzatore non funziona.`,options:[`The air conditioning isn’t working.`,`The air conditioning no work yesterday tomorrow.`,`The air conditioning doesn’t job.`],answer:0,why:`“Isn’t working” descrive un dispositivo che in questo momento non funziona.`},order:`Could you help us please`,orderIt:`Potrebbe aiutarci, per favore?`,gap:`There ___ a problem with our room.`,gapAnswer:`is`,speak:`Comunica alla reception che il climatizzatore non funziona e chiedi di cambiare camera.`,speakModel:`The air conditioning isn’t working. Could we change rooms, please?`},{id:`health`,title:`Chiedere aiuto`,en:`Getting help`,category:`Imprevisti`,icon:`heart`,color:`mint`,goal:`Comunicare un bisogno di assistenza con frasi chiare.`,rule:`Per un bisogno: “I need…” o “We need…”. “I’m allergic to…” introduce un’allergia. “I’ve lost…” racconta una perdita con conseguenze adesso. Qui alleni le frasi, non procedure mediche.`,phrases:[[`I need a doctor.`,`Ho bisogno di un medico.`],[`Where is the nearest pharmacy?`,`Dov’è la farmacia più vicina?`],[`I’m allergic to peanuts.`,`Sono allergico/a alle arachidi.`],[`I’ve lost my passport.`,`Ho perso il passaporto.`],[`Could you write that down, please?`,`Potrebbe scriverlo, per favore?`]],dialogue:[[`You`,`Excuse me. Where is the nearest pharmacy?`],[`Local`,`There’s one next to the supermarket, opposite the station.`],[`You`,`Could you write the address down, please?`],[`Local`,`Of course. Here you are.`]],listen:{prompt:`Dov’è la farmacia?`,options:[`Dentro la stazione`,`Accanto al supermercato, di fronte alla stazione`,`Dietro l’hotel`],answer:1,why:`“Next to” = accanto a; “opposite” = di fronte a.`},choice:{prompt:`Come comunichi un’allergia alle arachidi?`,options:[`I am allergy peanuts.`,`I’m allergic to peanuts.`,`I have allergic for peanuts.`],answer:1,why:`La struttura corretta è “be allergic to + sostanza”.`},order:`Where is the nearest pharmacy`,orderIt:`Dov’è la farmacia più vicina?`,gap:`I’m allergic ___ peanuts.`,gapAnswer:`to`,speak:`Chiedi dove si trova la farmacia più vicina e chiedi di scrivere l’indirizzo.`,speakModel:`Where is the nearest pharmacy? Could you write the address down, please?`},{id:`story`,title:`Raccontare il viaggio`,en:`What a trip`,category:`Conversazione`,icon:`globe`,color:`blue`,goal:`Raccontare un’esperienza e dire cosa vi è piaciuto.`,rule:`Con un tempo passato preciso (“yesterday”, “last year”) usa il past simple: go → went, see → saw, have → had. Nelle domande “did” porta già il passato: “What did you see?”`,phra
